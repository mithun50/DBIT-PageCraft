<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | DBIT PageCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 440px;
    }
    .code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--primary-color);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--primary-color);
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .team { margin-top: 28px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; }
    .team span { font-weight: 600; color: var(--text-main); }
    .team a { color: var(--primary-color); text-decoration: none; }
    .team a:hover { text-decoration: underline; }
    .credits { margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .credits a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
    .credits a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Back to PageCraft</a>

      <a href="https://www.linkedin.com/in/nevil-anson-dsouza/" target="_blank">Nevil Anson DSouza</a> &middot;
      <a href="https://www.linkedin.com/in/manas-kiran-habbu-058487306/" target="_blank">Manas Kiran Habbu</a> &middot;
      <a href="https://www.linkedin.com/in/lekhan-hr-507b89371/" target="_blank">Lekhan H R</a>
    </div>
    <div class="credits">Credits: <a href="https://www.linkedin.com/in/maheshkgdev/" target="_blank">Mahesh Kumar G</a></div>
  </div>
</body>
</html>
