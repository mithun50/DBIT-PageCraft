<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – DBIT PageCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --text: #0f172a;
      --muted: #64748b;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px; width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08); text-align: center;
    }
    .login-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .login-card p { font-size: 0.9rem; color: var(--muted); margin-bottom: 28px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 1rem; font-family: inherit; margin-bottom: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    .login-card button {
      width: 100%; padding: 13px; background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.2s;
    }
    .login-card button:hover { background: #4338ca; }
    #login-error { color: var(--red); font-size: 0.85rem; margin-top: 10px; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 32px; max-width: 1200px; margin: 0 auto; }
    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .dash-header h1 { font-size: 1.6rem; font-weight: 700; }
    .dash-header p { font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-refresh, .btn-logout {
      padding: 9px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit; border: none; transition: all 0.2s;
    }
    .btn-refresh { background: var(--primary); color: #fff; }
    .btn-refresh:hover { background: #4338ca; }
    .btn-logout { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-logout:hover { background: #e2e8f0; }

    /* ── Stats ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.orange { color: var(--orange); }
    .stat-card .value.purple { color: var(--primary); }

    /* ── Charts ── */
    .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 28px; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .chart-card h4 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 14px; }

    /* ── Table ── */
    .table-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .table-card-header {
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .table-card-header h3 { font-size: 1rem; font-weight: 700; }
    #search-input {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.9rem; font-family: inherit; outline: none; width: 220px;
    }
    #search-input:focus { border-color: var(--primary); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th {
      background: #f8fafc; padding: 12px 16px; text-align: left;
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 16px; color: var(--text); vertical-align: middle; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .badge-pdf { background: #ede9fe; color: #6d28d9; }
    .badge-png { background: #d1fae5; color: #065f46; }
    .badge-merge { background: #fef3c7; color: #92400e; }
    .badge-report_pdf { background: #dbeafe; color: #1d4ed8; }
    .badge-report_merge { background: #fce7f3; color: #be185d; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    #loading-row td { text-align: center; padding: 40px; color: var(--muted); }

    @media (max-width: 600px) {
      #dashboard { padding: 16px; }
      .dash-header h1 { font-size: 1.2rem; }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin Dashboard</h2>
    <p>DBIT PageCraft — Analytics</p>
    <input type="email" id="email-input" placeholder="Admin email" />
    <input type="password" id="pwd-input" placeholder="Password" />
    <button onclick="doLogin()">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="dash-header">
    <div>
      <h1>Usage Dashboard</h1>
      <p id="user-email" style="font-size:0.85rem;color:var(--muted)"></p>
    </div>
    <div class="header-actions">
      <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="label">Total</div><div class="value purple" id="stat-total">—</div></div>
    <div class="stat-card"><div class="label">Front Page PDFs</div><div class="value green" id="stat-pdf">—</div></div>
    <div class="stat-card"><div class="label">PNG Exports</div><div class="value orange" id="stat-png">—</div></div>
    <div class="stat-card"><div class="label">Report PDFs</div><div class="value green" id="stat-report">—</div></div>
    <div class="stat-card"><div class="label">Merges</div><div class="value orange" id="stat-merge">—</div></div>
    <div class="stat-card"><div class="label">Unique Students</div><div class="value purple" id="stat-students">—</div></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h4>Daily Usage (Last 14 Days)</h4>
      <canvas id="chart-daily"></canvas>
    </div>
    <div class="chart-card">
      <h4>Breakdown by Type</h4>
      <canvas id="chart-type"></canvas>
    </div>
  </div>

  <div class="table-card">
    <div class="table-card-header">
      <h3>Generation Log</h3>
      <input type="text" id="search-input" placeholder="Search name, subject…" oninput="filterTable()" />
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Timestamp</th><th>Page</th><th>Type</th>
            <th>Student</th><th>USN</th><th>Subject</th><th>Semester</th>
          </tr>
        </thead>
        <tbody id="log-tbody">
          <tr id="loading-row"><td colspan="8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ── Supabase Config ──
  const SUPABASE_URL = 'https://jkhxpdsyouecsjresikt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpraHhwZHN5b3VlY3NqcmVzaWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjU3MzAsImV4cCI6MjA5NjE0MTczMH0.ulmw1uPs9z3fUNll88h06g_8VetZgwVjZYJq1cOCBQ0';

  let accessToken = null;
  let allRows = [];

  // ── Auth ──
  async function doLogin() {
    const email = document.getElementById('email-input').value;
    const pwd = document.getElementById('pwd-input').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pwd })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');

      accessToken = data.access_token;
      sessionStorage.setItem('sb_token', accessToken);
      sessionStorage.setItem('sb_email', email);
      showDashboard(email);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogout() {
    if (accessToken) {
      await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${accessToken}` }
      }).catch(() => {});
    }
    sessionStorage.clear();
    location.reload();
  }

  function showDashboard(email) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('user-email').textContent = email;
    loadData();
  }

  // Auto-login from session
  const savedToken = sessionStorage.getItem('sb_token');
  if (savedToken) {
    accessToken = savedToken;
    showDashboard(sessionStorage.getItem('sb_email') || '');
  }

  // ── Data ──
  async function loadData() {
    document.getElementById('log-tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted)">Loading…</td></tr>';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/generations?select=*&order=created_at.desc&limit=1000`, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
        }
      });
      if (res.status === 401) { sessionStorage.clear(); location.reload(); return; }
      if (!res.ok) throw new Error('Failed to fetch');
      allRows = await res.json();
      renderStats(allRows);
      renderCharts(allRows);
      renderTable(allRows);
    } catch (e) {
      document.getElementById('log-tbody').innerHTML =
        `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--red)">Failed to load data: ${e.message}</td></tr>`;
    }
  }

  // ── Stats ──
  function renderStats(rows) {
    const pdfs = rows.filter(r => r.type === 'PDF').length;
    const pngs = rows.filter(r => r.type === 'PNG').length;
    const reports = rows.filter(r => r.type === 'REPORT_PDF').length;
    const merges = rows.filter(r => r.type === 'MERGE' || r.type === 'REPORT_MERGE').length;
    const students = new Set(rows.map(r => r.student_name?.trim().toLowerCase()).filter(Boolean)).size;
    document.getElementById('stat-total').textContent = rows.length;
    document.getElementById('stat-pdf').textContent = pdfs;
    document.getElementById('stat-png').textContent = pngs;
    document.getElementById('stat-report').textContent = reports;
    document.getElementById('stat-merge').textContent = merges;
    document.getElementById('stat-students').textContent = students;
  }

  // ── Charts ──
  let dailyChart = null, typeChart = null;

  function renderCharts(rows) {
    const today = new Date();
    const days = Array.from({length: 14}, (_, i) => {
      const d = new Date(today); d.setDate(d.getDate() - (13 - i));
      return d.toISOString().slice(0, 10);
    });
    const fpCounts = days.map(d => rows.filter(r => r.created_at?.startsWith(d) && r.page === 'front-page').length);
    const rpCounts = days.map(d => rows.filter(r => r.created_at?.startsWith(d) && r.page === 'project-report').length);
    const labels = days.map(d => d.slice(5));

    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(document.getElementById('chart-daily'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Front Page', data: fpCounts, backgroundColor: '#6366f1', borderRadius: 4 },
          { label: 'Project Report', data: rpCounts, backgroundColor: '#10b981', borderRadius: 4 }
        ]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    const types = {};
    rows.forEach(r => { const t = r.type || 'Unknown'; types[t] = (types[t] || 0) + 1; });
    const colors = { PDF: '#6d28d9', PNG: '#10b981', MERGE: '#f59e0b', REPORT_PDF: '#3b82f6', REPORT_MERGE: '#ec4899', Unknown: '#94a3b8' };

    if (typeChart) typeChart.destroy();
    typeChart = new Chart(document.getElementById('chart-type'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(types),
        datasets: [{ data: Object.values(types), backgroundColor: Object.keys(types).map(t => colors[t] || '#94a3b8'), borderWidth: 0 }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    });
  }

  // ── Table ──
  function renderTable(rows) {
    const tbody = document.getElementById('log-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>No generations logged yet.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td style="color:var(--muted)">${rows.length - i}</td>
        <td style="white-space:nowrap">${r.created_at ? new Date(r.created_at).toLocaleString('en-IN', {dateStyle:'medium',timeStyle:'short'}) : '—'}</td>
        <td><span class="badge" style="background:#f1f5f9;color:var(--muted)">${r.page || '—'}</span></td>
        <td><span class="badge badge-${(r.type||'').toLowerCase()}">${r.type || '—'}</span></td>
        <td><strong>${r.student_name || '—'}</strong></td>
        <td>${r.usn || '—'}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.subject || ''}">${r.subject || '—'}</td>
        <td>${r.semester || '—'}</td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = allRows.filter(r =>
      (r.student_name || '').toLowerCase().includes(q) ||
      (r.usn || '').toLowerCase().includes(q) ||
      (r.subject || '').toLowerCase().includes(q) ||
      (r.page || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
    renderStats(filtered);
  }
</script>
</body>
</html>
